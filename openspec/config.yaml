schema: spec-driven

context: |
  ingredia. Документы на русском; служебные заголовки OpenSpec на английском.
  Подтверждённый стек: FastAPI и два Telegram-бота. Python через uv.
  Основная БД: PostgreSQL. Медиа хранить отдельно.
  Docker Compose для локального запуска и первого размещения на сервере; детали хостинга ещё
  открыты.
  В будущем Android: общий версионируемый API, независимая от Telegram идентичность. Мобильная
  реализация вне MVP.
  QA: только pytest через uv run pytest. Без скриншотного тестирования.
  UX/UI: использовать доступные релевантные skills, не выдумывать их наличие.
  Проектировать безопасность, проверку доступа и расширяемые адаптеры ботов.
  Пользователь разрешил реализацию и pytest 2026-10-30; выполнять по фазам.
  Первая часть Telegram MVP реализуется; критерии завершения проверяются отдельно.
  Весь UX пока в Telegram: меню, личный кабинет, холодильник, рецепты и избранное.
  React, веб-админка и Mini App вне текущего объёма.
  Админ-бот отдельный: доверенные ID, default deny, проверка прав на каждом действии.
  После каждой реализации применять проектный скилл code-reviewer.
  Продукт: виртуальный холодильник, рецепты и личное избранное. Канал бота MVP только Telegram.
  В MVP также отдельный админ-бот: права, список/поиск, карточка,
  блокировка/разблокировка и аудит.
  ВК лишь возможное будущее расширение; паттерн адаптера обязателен, реализация ВК вне текущего
  объёма.
  Фото для рецептов сверять с запасами; покупки добавлять по фото/голосу.
  Неясные продукты уточнять. Количество, объём и сроки хранить с источником и признаком оценки.
  Персонализировать предложения по исправлениям пользователя, не выдавая оценку срока за гарантию
  безопасности.
  AI требуется из РФ и пока бесплатно: выбран прямой Z.ai API, glm-4.7-flash для текста/рецептов и
  glm-4.6v-flash для фото. Платные маршруты/автопополнение запрещены.
  AI только через облачные API на обычном VPS, без локальных моделей/GPU. Выбор GLM принят; доступ,
  квоты и качество ещё проверить. Бесплатный STT пока не выбран. Решение —
  docs/ai-model-research-2026-10-29.md.
  Qwen через Groq добавлен как отдельный адаптер; AI__PROVIDER выбирает его или сохранённый Z.ai.
  Ключ Groq получен, активен Qwen. Z.ai сохранён для явного возврата. См. docs/ai-providers.md.
  См. docs/product-brief.md для подтверждённых сценариев и допущений MVP.
  Не считать предложенную архитектуру или наличие tasks.md разрешением на реализацию.

rules:
  proposal:
    - Отделять подтверждённые требования от предложений и неизвестных данных.
    - Перечислять capabilities с точным совпадением имён каталогов спецификаций.
  specs:
    - Для каждого SHALL/MUST требования добавлять WHEN/THEN сценарии успеха и значимых отказов.
    - Описывать наблюдаемое поведение; детали стека и внутреннего устройства помещать в design.
  design:
    - Учитывать проверку доступа, хранение секретов, сбои и ограничения провайдеров ботов.
    - Указывать подход к pytest и ручную приёмку Telegram без браузерных и скриншотных тестов.
  tasks:
    - Группировать задачи по фазам и зависимостям; для каждой указывать способ проверки.
    - Оставлять задачи реализации невыполненными на этапе спецификаций.
