[project]
name = "ingredia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20,<4",
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=8,<10",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["ingredia"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
