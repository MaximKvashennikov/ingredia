[project]
name = "ingredia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["ingredia"]
strict = true
plugins = ["pydantic.mypy"]
